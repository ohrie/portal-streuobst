services:
  streuobstwiesen-pipeline:
    image: ${DOCKER_REGISTRY}/streuobstwiesen-pipeline:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: streuobstwiesen-processing
    volumes:
      # Mount data directories to persist between runs
      - ./data:/app/data
      - ./temp:/app/temp
      - ./output:/app/output
      # Mount logs
      - ./logs:/app/logs
      # Datenverzeichnis der Web-App: stats.json/stats_laender.json landen direkt dort,
      # damit der Cron-Lauf ohne zusaetzlichen Kopierschritt auskommt.
      # Auf dem Server setzt das Deployment PORTAL_DATA_DIR in der .env auf
      # /srv/portal-streuobst/data; lokal faellt es harmlos auf ./output zurueck.
      - ${PORTAL_DATA_DIR:-./output}:/app/portal-data
    environment:
      - PORTAL_DATA_DIR=/app/portal-data
      # Load from .env file (if needed)
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_TO=${SMTP_TO}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    # Resource limits
    mem_limit: 4g
    cpus: 4
    restart: "no"  # Don't restart automatically - run on schedule
